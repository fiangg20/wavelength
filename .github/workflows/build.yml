name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Download Google Sans Flex font
        run: |
          mkdir -p app/src/main/res/font
          curl -fsSL -o app/src/main/res/font/google_sans_flex.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/googlesansflex/GoogleSansFlex%5BROND%2Copsz%2Cslnt%2Cwdth%2Cwght%5D.ttf" || echo "Font download failed, the app will use the system font"
          if [ -f app/src/main/res/font/google_sans_flex.ttf ] && [ "$(stat -c%s app/src/main/res/font/google_sans_flex.ttf)" -lt 100000 ]; then
            rm -f app/src/main/res/font/google_sans_flex.ttf
            echo "Font file looked wrong, removed it"
          fi
          ls -la app/src/main/res/font || true

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Wavelength.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest Wavelength.apk --title "Wavelength build ${{ github.run_number }}" --notes "Debug APK, install and allow unknown apps." --target "${{ github.sha }}"
